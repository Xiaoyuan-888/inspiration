<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综艺花絮灵感锦囊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部保密提示 -->
    <div class="notice-bar">
        内部录制使用 · 请勿对外传播
    </div>

    <div class="container">
        <!-- 标签切换 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="draw">灵感抽签</button>
            <button class="tab-btn" data-tab="questions">采访问题库</button>
        </div>

        <!-- 抽签页面 -->
        <div class="tab-content active" id="draw-tab">
            <h1 class="main-title">今天不知道拍什么？<br>来抽个灵感锦囊吧</h1>
            
            <button id="draw-btn" class="primary-btn">抽取灵感</button>

            <div class="card-container" id="card-container">
                <div class="card" data-type="solo">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-tag">单人款</div>
                            <div class="card-hint">点击抽取解锁</div>
                        </div>
                        <div class="card-back">
                            <div class="card-tag">单人款</div>
                            <h3 class="card-title"></h3>
                            <p class="card-desc"></p>
                        </div>
                    </div>
                </div>

                <div class="card" data-type="multi">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-tag">多人款</div>
                            <div class="card-hint">点击抽取解锁</div>
                        </div>
                        <div class="card-back">
                            <div class="card-tag">多人款</div>
                            <h3 class="card-title"></h3>
                            <p class="card-desc"></p>
                        </div>
                    </div>
                </div>

                <div class="card" data-type="challenge">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-tag">挑战款</div>
                            <div class="card-hint">点击抽取解锁</div>
                        </div>
                        <div class="card-back">
                            <div class="card-tag">挑战款</div>
                            <h3 class="card-title"></h3>
                            <p class="card-desc"></p>
                        </div>
                    </div>
                </div>
            </div>

            <button id="refresh-btn" class="secondary-btn" style="display: none;">换一组试试</button>
        </div>

        <!-- 采访问题页面 -->
        <div class="tab-content" id="questions-tab">
            <h2 class="section-title">采访问题库</h2>
            <p class="section-desc">按主题分类浏览，也可随机抽取一个问题即兴提问</p>
            
            <div id="question-list" class="question-list"></div>
        </div>
    </div>

    <!-- 数据文件 -->
    <script src="data/topics.js"></script>
    <script src="data/questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
