<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感锦囊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部保密提示 -->
    <div class="notice-bar">
        🎬 内部物料参考 · 请勿外传 @小圆
    </div>

    <div class="container">
        <!-- 标签切换 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="draw">✨ 灵感抽签</button>
            <button class="tab-btn" data-tab="tips">📝 录制宝典</button>
            <button class="tab-btn" data-tab="questions">💬 问答库</button>
        </div>

        <!-- 抽签页面 -->
        <div class="tab-content active" id="draw-tab">
            <h1 class="main-title">今天不知道拍什么？<br>来抽个灵感锦囊吧！</h1>
            
            <button id="draw-btn" class="primary-btn">点这里抽取灵感 🎲</button>

            <div class="card-container" id="card-container">
                <div class="card" data-type="solo">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-tag">🧑 单人就能拍</div>
                        </div>
                        <div class="card-back">
                            <div class="card-tag">🧑 单人就能拍</div>
                            <h3 class="card-title"></h3>
                            <p class="card-desc"></p>
                        </div>
                    </div>
                </div>

                <div class="card" data-type="multi">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-tag">👥 需要小伙伴</div>
                        </div>
                        <div class="card-back">
                            <div class="card-tag">👥 需要小伙伴</div>
                            <h3 class="card-title"></h3>
                            <p class="card-desc"></p>
                        </div>
                    </div>
                </div>

                <div class="card" data-type="challenge">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-tag">🔥 挑战一下！</div>
                        </div>
                        <div class="card-back">
                            <div class="card-tag">🔥 挑战一下！</div>
                            <h3 class="card-title"></h3>
                            <p class="card-desc"></p>
                        </div>
                    </div>
                </div>
            </div>

            <button id="refresh-btn" class="secondary-btn" style="display: none;">换一组试试 🔄</button>
            <button id="toggle-list-btn" class="secondary-btn" style="display: none;">点这里看全部灵感 📋</button>

            <!-- 主题列表区域 默认隐藏 -->
            <div id="topic-list" class="topic-list" style="display: none; margin-top: 24px;"></div>
        </div>

        <!-- 录制宝典页面 -->
        <div class="tab-content" id="tips-tab">
            <h2 class="section-title">不要慌！这里有些小贴士</h2>
            <p class="section-desc">点击标题展开查看详细说明</p>
            <div id="tip-list" class="tip-list"></div>
        </div>

        <!-- 随机问答库页面（默认锁定） -->
        <div class="tab-content" id="questions-tab">
            <!-- 密码锁定遮罩 -->
            <div class="password-lock" id="password-lock">
                <div class="lock-box">
                    <div class="lock-icon">🔒</div>
                    <input type="password" id="password-input" placeholder="请输入密码">
                    <button id="unlock-btn" class="primary-btn small">解锁查看</button>
                    <p class="lock-error" id="lock-error" style="display: none; color: #c9553c; font-size: 13px; margin-top: 8px;">密码错误，请重试</p>
                </div>
            </div>

            <!-- 问答内容（默认隐藏） -->
            <div id="questions-content" style="display: none;">
                <h2 class="section-title">💬 问答库</h2>
                <p class="section-desc">按主题分类浏览，方便现场快速取用</p>
                <div id="question-list" class="question-list"></div>
            </div>
        </div>

        <!-- 底部鼓励语 -->
        <div class="footer-tip">
            仅供参考 · 展示你真实的一面就好 ✨
        </div>
    </div>

    <!-- 数据文件 -->
    <script src="data/topics.js"></script>
    <script src="data/tips.js"></script>
    <script src="data/questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
